worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    server {
        listen 80;
        server_name localhost;

        # Directori utama frontend
        root /var/www/html/dist;
        index index.html;

        # 1. Routing Frontend Single Page App (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 2. Routing ke Laravel via FastCGI
        location /api {
            alias /var/www/html/backend/public;
            try_files $uri $uri/ @laravel;

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
                
                # Gunakan fastcgi_pass, BUKAN proxy_pass!
                fastcgi_pass 127.0.0.1:9000;
                
                fastcgi_read_timeout 600s;
                fastcgi_buffering off; # Penting untuk SSE / Stream progress download
            }
        }

        location @laravel {
            rewrite /api/(.*)$ /api/index.php?/$1 last;
        }
    }
}
