worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Logging ke stdout/stderr agar muncul di log Render
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    server {
        listen 80;
        server_name localhost;

        # 1. Folder file statis frontend (HTML, JS, CSS)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy request /api/ ke Backend Server (misal Node.js/Python di port 3000)
        location /api/ {
            proxy_pass http://127.0.0.1:3000; # Sesuaikan port backend jika bukan 3000
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Batas waktu timeout lebih panjang (cocok untuk proses download yt-dlp)
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
