worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    server {
        listen 80;
        server_name localhost;

        # Root utama mengarah ke hasil build frontend
        root /var/www/html/dist;
        index index.html;

        # 1. Routing Frontend Single Page App (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy request /api/ ke Laravel (PHP-FPM)
location /api/ {
    proxy_pass http://127.0.0.1:9000; # Atau fastcgi_pass untuk PHP-FPM
    
    # Konfigurasi khusus SSE
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding on;
}

        location @laravel {
            rewrite /api/(.*)$ /api/index.php?/$1 last;
        }
    }
}